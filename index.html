<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    input {

}
main {

}
section {

}
footer {

      background-color: darkgray;

    }

      color: #dce5f0;
    }
    p {

    a {

    padding: 40px 80px;
  }

    font-size: 48px;
  }

    width: 160px;
  }
    }
</style>
</head>
<body>
  <h1>Hello, world!</h1>
  <p>This is my first web page.</p>
  <a href="https://www.google.org">Visit Google</a>
  <br><br>
  <img src="https://picsum.photos/350" alt="A random photo">
<div class="row">
  <div class="box">One</div>
  <div class="box">Two</div>
  <div class="box">Three</div>
  <div class="box">Four</div>
</div>
  <header>
  <h1>Hello, world!</h1>
  <nav>
    <a href="#about">About</a>
    <a href="#gallery">Gallery</a>
  </nav>
</header>

<main>
  <section id="todo">
  <h2>My To-Do List</h2>
  <input type="text" id="taskInput" placeholder="Add a task">
  <button id="addBtn">Add</button>
  <ul id="taskList"></ul>
  </section>
  <section id="about">
    <p>This is my first web page.</p>
    <a href="https://www.google.org">Visit Google</a>
  </section>

  <section id="gallery">
    <img src="https://picsum.photos/350" alt="A random photo">
    <div class="row">
      <div class="box">One</div>
      <div class="box">Two</div>
      <div class="box">Three</div>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 My First Page</p>
</footer>
  <button id="colorBtn">Change background</button>
<p id="message">Tap the button!</p>
</body>
  <script>
  const button = document.getElementById("colorBtn");
  const message = document.getElementById("message");
  let count = 0;

  const colors = ["lightblue", "pink", "lightgreen", "khaki", "plum", "darkgray","orange","coffee"];

  button.addEventListener("click", function () {
    count = count + 1;
    const randomIndex = Math.floor(Math.random() * colors.length);
    const newColor = colors[randomIndex];
    document.body.style.backgroundColor = newColor;
    message.textContent = "Color: " + newColor + " (taps: " + count + ")";
  });const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function renderTasks() {
  taskList.innerHTML = "";
  tasks.forEach(function (task, index) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = task;

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.addEventListener("click", function () {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    });

    li.appendChild(span);
    li.appendChild(delBtn);
    taskList.appendChild(li);
  });
}

addBtn.addEventListener("click", function () {
  const text = taskInput.value.trim();
  if (text === "") return;
  tasks.push(text);
  saveTasks();
  renderTasks();
  taskInput.value = "";
});

renderTasks();
  

addBtn.addEventListener("click", function () {
  const text = taskInput.value.trim();
  if (text === "") return;

  const li = document.createElement("li");
  const span = document.createElement("span");
  span.textContent = text;

  const delBtn = document.createElement("button");
  delBtn.textContent = "Delete";
  delBtn.addEventListener("click", function () {
    li.remove();
  });

  li.appendChild(span);
  li.appendChild(delBtn);
  taskList.appendChild(li);
  taskInput.value = "";
});
  </script>
</html>
